<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- Başlık ÇEVRİLMEZ ve electron/mini-hud.js::MINI_BASLIK ile AYNI kalır:
       Hyprland konum yazdırması pencereyi başlıkla bulur. -->
  <title>Yuki Mini HUD</title>

  <!-- Mini HUD kartı (2026-10-04) — ana pencere gizliyken ekranda kalan
       durum yüzeyi. Bu sayfa HİÇBİR API çağırmaz, WS açmaz, mikrofona dokunmaz:
       veri ana pencereden IPC ile gelir (electron/mini-hud.js). Token yok →
       adres çubuğunda taşınacak kimlik de yok ( sınıfı burada doğmaz).
       ⚠️ Ortak dosyaların ?v= damgaları index.html ile AYNI olmalı
       (backend/tests/test_mini_hud.py denetler) — yoksa kart eski sözlüğü görür. -->
  <link rel="stylesheet" href="/ui/vendor/fonts.css?v=1">
  <link rel="stylesheet" href="/ui/css/tokens.css?v=8">
  <script src="/ui/js/tema.js?v=6"></script>
  <script src="/ui/js/diller/tr.js?v=102"></script>
  <script src="/ui/js/diller/ja.js?v=5"></script>
  <script src="/ui/js/diller/en.js?v=102"></script>
  <script src="/ui/js/dil.js?v=7"></script>
  <link rel="stylesheet" href="/ui/css/mini-hud.css?v=2">
</head>
<body>

  <!-- data-state: mini-hud.js yazar · data-bagli: ana pencere köprüsü canlı mı -->
  <main class="hud" id="hud" data-state="idle" data-bagli="hayir"
        data-i18n-aria-label="mini-hud.bolge" aria-label="Yuki durum kartı">

    <div class="hud-baslik">
      <span class="hud-nokta" aria-hidden="true"></span>
      <span class="hud-etiket" id="hud-etiket" role="status" aria-live="polite"
            data-i18n="mini-hud.durum.baglaniyor">BAĞLANIYOR</span>
    </div>

    <!-- Kap ölçüyü taşır, canvas mutlak konumla içine oturur: canvas doğrudan
         flex çocuğu olsaydı DPR ile yazılan width/height layout'a geri beslenirdi
         (kişiselde ölçüldü — merkez 14 px kaymıştı). -->
    <div class="hud-tuval-kap">
      <canvas class="hud-tuval" id="hud-tuval" aria-hidden="true"></canvas>
    </div>

    <div class="hud-alt">
      <button class="hud-mic" id="hud-mic" type="button" aria-pressed="false"
              data-i18n-title="mini-hud.mikrofon" data-i18n-aria-label="mini-hud.mikrofon"
              title="Mikrofon (bas-konuş)" aria-label="Mikrofon (bas-konuş)">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <rect x="9" y="2" width="6" height="11" rx="3"/>
          <path d="M5 11a7 7 0 0 0 14 0M12 18v3"/>
        </svg>
      </button>
      <button class="hud-mic" id="hud-kulak" type="button" aria-pressed="false"
              data-i18n-title="mini-hud.dinle" data-i18n-aria-label="mini-hud.dinle"
              title="Her zaman dinle" aria-label="Her zaman dinle">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="12" cy="12" r="2"/>
          <path d="M8.5 8.5a5 5 0 0 0 0 7M15.5 8.5a5 5 0 0 1 0 7"/>
          <path d="M5.6 5.6a9 9 0 0 0 0 12.8M18.4 5.6a9 9 0 0 1 0 12.8"/>
        </svg>
      </button>
      <!-- Son Yuki mesajı (kısaltılmış). Ekran okuyucuya ayrıca okutulmaz:
           etiket zaten aria-live taşıyor. -->
      <p class="hud-metin" id="hud-metin"></p>
    </div>

    <div class="hud-kontrol">
      <button class="hud-dugme" id="hud-buyut" type="button"
              data-i18n-title="mini-hud.buyut" data-i18n-aria-label="mini-hud.buyut"
              title="Ana pencereyi aç" aria-label="Ana pencereyi aç">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M15 3h6v6M21 3l-7 7M9 21H3v-6M3 21l7-7"/>
        </svg>
      </button>
      <button class="hud-dugme" id="hud-gizle" type="button"
              data-i18n-title="mini-hud.gizle" data-i18n-aria-label="mini-hud.gizle"
              title="Mini HUD'u kapat" aria-label="Mini HUD'u kapat">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M18 6 6 18M6 6l12 12"/>
        </svg>
      </button>
    </div>

  </main>

  <script>window.YukiDil && window.YukiDil.ciz(document);</script>
  <script src="/ui/js/mini-hud.js?v=3"></script>
</body>
</html>
