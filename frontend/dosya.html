<div class="dy-gok" aria-hidden="true"></div>
<header class="dy-ust">
  <div class="dy-marka"><svg class="dy-sigil" aria-hidden="true"><use href="#i-sigil"/></svg><h1>DOSYALAR</h1></div>
  <div class="dy-kokler" id="dy-kokler" role="tablist" aria-label="Kökler"></div>
  <!-- F5: bu klasörde süz (yüklü satırlar, istemcide; "/" odaklar, Esc temizler) -->
  <label class="dy-suz"><svg aria-hidden="true"><use href="#i-ara"/></svg><input id="dy-suz" type="search" placeholder="Süz · Enter: alt klasörlerde ara" aria-label="Bu klasörde süz, Enter ile alt klasörlerde ara" title="Yazdıkça bu klasörü süzer · Enter alt klasörlerde arar · Esc temizler" autocomplete="off" spellcheck="false"><kbd>/</kbd></label>
  <div class="dy-araclar">
    <select id="dy-sira" class="dy-secim" aria-label="Sırala">
      <option value="ad">Ad</option><option value="tarih">Tarih</option>
      <option value="boyut">Boyut</option><option value="tur">Tür</option>
    </select>
    <button id="dy-yon" class="dy-dugme dy-yon" title="Sıralama yönü" aria-label="Sıralama yönü">↑</button>
    <button id="dy-ara-ac" class="dy-dugme dy-tel-yalniz" type="button" title="Bu klasörde süz" aria-label="Süz" aria-expanded="false" aria-controls="dy-suz"><svg><use href="#i-ara"/></svg></button>
    <button id="dy-gizli" class="dy-dugme" title="Gizli dosyaları göster" aria-pressed="false" aria-label="Gizli dosyalar"><svg><use href="#i-goz"/></svg></button>
    <button id="dy-tema" class="dy-dugme" title="Tema: Grimoire / Gözlemevi / Klasik" aria-label="Tema değiştir"><svg><use href="#i-tema"/></svg></button>
    <button id="dy-gorunum" class="dy-dugme" title="Liste / ızgara" aria-label="Görünüm"><svg><use href="#i-izgara"/></svg></button>
  </div>
</header>


<!-- Kip + konum şeridi: salt okunur kilit rozeti + gezinti/kırıntı. Yazma ucu yok (bu sürüm yalnız gezer). -->
<div class="dy-kip-serit" id="dy-kip-serit" role="toolbar" aria-label="Kip ve konum">
  <span class="dy-kip-rozet" id="dy-kip-rozet"><svg><use href="#i-kilit"/></svg><span id="dy-kip">Salt okunur</span></span>
  <div class="dy-gezinti" role="group" aria-label="Gezinti">
    <button id="dy-geri" class="dy-dugme" title="Geri (Alt+←)" aria-label="Geri"><svg><use href="#i-sol"/></svg></button>
    <button id="dy-ileri" class="dy-dugme" title="İleri (Alt+→)" aria-label="İleri"><svg><use href="#i-sag"/></svg></button>
    <button id="dy-yukari" class="dy-dugme" title="Üst klasör (Alt+↑ · Backspace)" aria-label="Üst klasör"><svg><use href="#i-yukari"/></svg></button>
  </div>
  <button id="dy-yerimi" class="dy-dugme dy-yerimi-dug" type="button" title="Bu klasörü yer imlerine ekle (Ctrl+D)" aria-label="Yer imi" aria-pressed="false"><svg><use href="#i-yildiz"/></svg></button>
  <nav id="dy-kirinti" class="dy-kirinti" aria-label="Konum" title="Yol yazmak için boş yere tıkla ya da Ctrl+L"></nav>
  <form id="dy-yol-form" class="dy-yol-form" hidden>
    <input id="dy-yol" class="dy-yol" type="text" spellcheck="false" autocomplete="off" aria-label="Yol yaz">
  </form>
  <!-- Kip notu: bu sürüm salt okunur gezer; güvenli dosya eki (dosya-guvenli.js) varsa metni o günceller. -->
  <span class="dy-kapi-not" id="dy-kapi-not" role="note">Salt okunur — bu kurulumda dosyalar yalnız gezilir</span>
  <!-- Gönder: seçili dosya(lar) → Yuki'ye gönder (sohbet eki, kabuk alır) · İndir. Salt okunurda da açık. -->
  <button id="dy-gonder" class="dy-dugme dy-gonder-dug" type="button" title="Gönder — önce dosya seç" aria-label="Gönder"
          aria-haspopup="menu" aria-expanded="false" disabled><svg><use href="#i-gonder"/></svg><span>Gönder</span></button>
</div>

<main class="dy-govde">
  <!-- F5 · Sütun gezgini (Taslak B): açık klasörün üst klasörleri solda, salt okunur sütunlar (tek liste GET'i/sütun) -->
  <div class="dy-atalar" id="dy-atalar" aria-label="Üst klasörler"></div>
  <section class="dy-alan" id="dy-alan" aria-label="Klasör içeriği">
    <div class="dy-panel-bas"><svg aria-hidden="true"><use href="#i-klasor"/></svg><h2 id="dy-panel-ad"></h2><em id="dy-panel-alt"></em><span class="dy-sayi" id="dy-panel-sayi"></span><button id="dy-arama-kapat" class="dy-dugme dy-arama-kapat" type="button" title="Aramayı kapat (Esc)" hidden><svg><use href="#i-kapat"/></svg><span>Aramayı kapat</span></button></div>
    <div class="dy-baslik-satir" id="dy-baslik-satir">
      <span>Ad</span><span>Boyut</span><span>Değiştirilme</span>
    </div>
    <ul id="dy-liste" class="dy-liste" role="listbox" tabindex="0" aria-label="Dosyalar"></ul>
    <div id="dy-durum" class="dy-durum" role="status"></div>
    <div id="dy-sentinel" class="dy-sentinel"></div>
  </section>
  <aside class="dy-onizleme" id="dy-onizleme" hidden aria-label="Önizleme">
    <span class="dy-kurdele" aria-hidden="true"></span>
    <div class="dy-folyo">ÖNİZLEME</div>
    <div class="dy-on-ust">
      <strong id="dy-on-ad" class="dy-on-ad"></strong>
      <button id="dy-on-kapat" class="dy-dugme" aria-label="Önizlemeyi kapat (Esc)"><svg><use href="#i-kapat"/></svg></button>
    </div>
    <dl id="dy-on-bilgi" class="dy-on-bilgi"></dl>
    <div id="dy-on-icerik" class="dy-on-icerik"></div>
    <div class="dy-on-eylem">
      <button id="dy-on-gonder" class="dy-dugme dy-indir" hidden title="Bu dosyayı sohbette Yuki'ye ilet"><svg><use href="#i-gonder"/></svg><span>Yuki'ye gönder</span></button>
      <button id="dy-on-indir" class="dy-dugme dy-indir"><svg><use href="#i-indir"/></svg><span>İndir</span></button>
    </div>
  </aside>
</main>

<footer class="dy-alt" id="dy-alt"></footer>

  <button type="button" id="dy-t-geri"><svg><use href="#i-sol"/></svg><span>Geri</span></button>
  <button type="button" id="dy-t-ust"><svg><use href="#i-yukari"/></svg><span>Üst</span></button>
  <button type="button" id="dy-t-kokler" aria-expanded="false" aria-controls="dy-tel-panel"><svg><use href="#i-klasor"/></svg><span>Kökler</span></button>
  <button type="button" id="dy-t-sira" aria-expanded="false" aria-controls="dy-tel-panel"><svg><use href="#i-sira"/></svg><span>Sırala</span></button>
</nav>
<div id="dy-duyuru" class="dy-duyuru" role="alert" hidden><span id="dy-duyuru-metin"></span><button id="dy-duyuru-eylem" class="dy-dugme" type="button" hidden></button></div>
