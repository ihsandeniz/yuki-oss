  KENDİSİ taşır. Dil kodu ana süreçten sorgu parametresiyle gelir
  (`uygulama.js` → `loadFile(…, { query: { dil } })`). Parametre yoksa tr, bilinmeyen

      --yuzey-2: oklch(0.994 0.002 295);
      --kenar: oklch(0.880 0.008 295);
      --ink-1: oklch(0.240 0.012 295);
      --ink-2: oklch(0.430 0.014 295);
      --ink-3: oklch(0.530 0.016 295);
      --kirmizi-ink: oklch(0.500 0.200 27);
      --kirmizi-zemin: oklch(0.930 0.030 27);
      color-scheme: light;
    }
  }

  * { box-sizing: border-box; }

  html,
  body {
    width: 100%;
    height: 100%;
    margin: 0;
    overflow: hidden;
    background: transparent;
  }

  body {
    padding: var(--b-4);
    color: var(--ink-1);
    font-family: var(--font);
    font-size: 16px;
    font-weight: var(--ag-normal);
    -webkit-user-select: none;
  }

  .kabuk {
    position: relative;
    display: grid;
    width: 100%;
    height: 100%;
    min-height: 0;
    overflow: hidden;
    place-items: center;
    border: 1px solid var(--kenar);
    border-radius: var(--r-5);
    background: var(--bg);
    -webkit-app-region: drag;
  }

  .kabuk::before {
    position: absolute;
    top: 50%;
    left: 50%;
    width: min(72vw, 720px);
    aspect-ratio: 1;
    border: 1px solid var(--kenar);
    border-radius: var(--r-tam);
    content: '';
    opacity: 0.38;
    transform: translate(-50%, -50%);
  }

  /* Çemberin içinde ORTALI ( L11): sola yaslı içerik çemberle hizasız duruyordu. */
  .icerik {
    display: grid;
    width: min(560px, calc(100% - (2 * var(--b-11))));
    gap: var(--b-11);
    padding: var(--b-9) 0;
    justify-items: center;
    text-align: center;
  }

  .marka {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: var(--b-6);
  }

  .marka-isareti {
    display: block;
    width: 64px;
    height: 64px;
    object-fit: cover;
    border: 1px solid var(--kenar);
    border-radius: var(--r-tam);
    background: var(--yuzey-1);
  }

  h1 {
    margin: 0;
    /* letter-spacing son harften sonra da boşluk bırakır; ortada dursun diye telafi. */
    margin-inline-start: 0.22em;
    color: var(--ink-1);
    font-size: var(--yazi-23);
    font-weight: var(--ag-kalin);
    letter-spacing: 0.22em;
    line-height: 1;
  }

  .hazirlik {
    display: grid;
    width: 100%;
    gap: var(--b-6);
    justify-items: center;
  }

  /* Ray zeminden ayrışsın ( L10): --yuzey-2 açık temada zeminden AÇIK,
     koyuda zemine çok yakındı; ray görünmüyor, akış boşlukta yüzüyordu. */
  .ilerleme {
    position: relative;
    width: 100%;
    height: 3px;
    overflow: hidden;
    border-radius: var(--r-tam);
    background: var(--kenar);
  }

  .ilerleme-akisi {
    position: absolute;
    inset: 0 auto 0 0;
    width: 34%;
    border-radius: inherit;
    background: var(--ink-2);
    animation: akis 1.35s var(--egri) infinite;
  }

  @keyframes akis {
    0% { transform: translateX(-105%); }
    100% { transform: translateX(295%); }
  }

  #durum {
    min-height: 1.5em;
    margin: 0;
    color: var(--ink-2);
    font-size: var(--yazi-14);
    line-height: var(--satir-orta);
  }

  #ipucu {
    max-width: 52ch;
    min-height: 3em;
    margin: 0 auto;
    color: var(--ink-3);
    font-size: var(--yazi-12);
    line-height: var(--satir-orta);
    opacity: 0;
    transform: translateY(var(--b-3));
    transition:
      opacity var(--sure-4) var(--egri),
      transform var(--sure-4) var(--egri);
  }

  #ipucu.gorunur {
    opacity: 1;
    transform: translateY(0);
  }

  /* Çubukla aynı genişlik ( L12): 54ch tavanı kutuyu çubuktan dar bırakıyordu. */
  .hata {
    display: grid;
    grid-template-columns: 20px 1fr;
    gap: var(--b-5);
    align-items: start;
    width: 100%;
    text-align: start;
    padding: var(--b-5) var(--b-6);
    border-radius: var(--r-3);
    background: var(--kirmizi-zemin);
    color: var(--kirmizi-ink);
    font-size: var(--yazi-12);
    line-height: var(--satir-orta);
  }

  .hata[hidden] { display: none; }

  .hata svg {
    width: 20px;
    height: 20px;
    stroke: currentColor;
    stroke-width: 1.5;
  }

  .hata p { margin: 0; }

  .kabuk[data-hata="true"] .ilerleme-akisi {
    width: 100%;
    background: var(--kirmizi-ink);
    animation: none;
    transform: none;
  }

  .kabuk[data-hata="true"] #durum { color: var(--kirmizi-ink); }
  .kabuk[data-hata="true"] #ipucu { display: none; }

  @media (max-width: 420px), (max-height: 560px) {
    body { padding: var(--b-3); }

    .icerik {
      width: min(100% - (2 * var(--b-8)), 560px);
      gap: var(--b-9);
      padding: var(--b-8) 0;
    }

    .kabuk::before { width: 94vw; }
  }

  @media (prefers-reduced-motion: reduce) {
    *,
    *::before,
    *::after {
      animation: none !important;
      transition: none !important;
    }

    .ilerleme-akisi {
      left: 33%;
      transform: none;
    }

    #ipucu { transform: none; }
  }
</style>
</head>
<body>

        <h1>YUKI</h1>
      </header>

      <section class="hazirlik" aria-labelledby="durum">
        <div class="ilerleme" aria-hidden="true">
          <span class="ilerleme-akisi"></span>
        </div>
        <p id="durum" role="status" aria-live="polite" aria-atomic="true"></p>
        <p id="ipucu" aria-live="polite"></p>
        <div class="hata" id="hata" role="alert" hidden>

            <circle cx="12" cy="12" r="9"></circle>
            <path d="M12 7.5v5.25"></path>

          </svg>

<script>
  // Kendi kendine tırmanan durum metni. Ana süreç `splashDurum()` ile üzerine yazabilir,
  // ama yazmasa da kullanıcı bekleyişin sürdüğünü görür — sessiz ekran bırakma.
  var kabuk = document.getElementById('kabuk');
  var durum = document.getElementById('durum');
  var ipucu = document.getElementById('ipucu');
  var hata = document.getElementById('hata');
  var hataAciklama = document.getElementById('hata-aciklama');
  var t0 = Date.now();
  // Ana süreç konuştuysa otomatik metin susar.
  var elle = false;
  var hataAcik = false;

  var METIN = {
    tr: {
      baslik: 'Yuki başlatılıyor…',
      baslangic: 'Motor başlıyor…',
      b1: 'Motor hazırlanıyor — ilk açılış biraz uzun sürebilir.',
      b2: 'Hazırlık sürüyor. Yuki ilerlemeyi izliyor.',
      b3: 'Bu açılış olağandan uzun sürüyor; motor hâlâ izleniyor.',
      u1: 'İlk açılışta işletim sistemi uygulama paketini tarayabilir.',
      u2: 'Pencereyi açık bırak. Motor yanıt verir vermez Yuki kendiliğinden devam edecek.',
      hata: 'Arayüz motorla bağlantı kuramadı. Yuki yeniden deniyor; pencereyi açık bırak. Sorun sürerse açılış günlüğü hata penceresinde gösterilecek.'
    },
    en: {
      baslik: 'Starting Yuki…',
      baslangic: 'Starting the engine…',
      b1: 'Preparing the engine — the first launch may take a little longer.',
      b2: 'Preparation is still in progress. Yuki is monitoring it.',
      b3: 'This launch is taking longer than usual; the engine is still being monitored.',
      u1: 'On first launch, the operating system may scan the app package.',
      u2: 'Keep this window open. Yuki will continue automatically as soon as the engine responds.',
      hata: 'The interface could not connect to the engine. Yuki is retrying; keep this window open. If the problem continues, the startup log will appear in the error window.'
    }
  };
  var dil = (/[?&]dil=([a-z]+)/.exec(location.search) || [])[1] || 'tr';
  var M = METIN[dil] || METIN.en;
  document.documentElement.lang = METIN[dil] ? dil : 'en';
  document.title = M.baslik;
  durum.textContent = M.baslangic;
  hataAciklama.textContent = M.hata;

  var basamaklar = [
    [6000, M.b1],
    [15000, M.b2],
    [30000, M.b3],
  ];
  var uyarilar = [
    [12000, M.u1],
    [40000, M.u2],
  ];

  setInterval(function () {
    if (hataAcik) return;
    var ms = Date.now() - t0;
    if (!elle) {
      for (var i = basamaklar.length - 1; i >= 0; i--) {
        if (ms >= basamaklar[i][0]) { durum.textContent = basamaklar[i][1]; break; }
      }
    }
    for (var j = uyarilar.length - 1; j >= 0; j--) {
      if (ms >= uyarilar[j][0]) {
        ipucu.textContent = uyarilar[j][1];
        ipucu.classList.add('gorunur');
        break;
      }
    }
  }, 500);

  // Ana süreç executeJavaScript ile çağırır; iki parametreli sözleşme korunur.
  window.splashDurum = function (metin, hataMi) {
    elle = true;
    hataAcik = Boolean(hataMi);
    kabuk.dataset.hata = String(hataAcik);
    hata.hidden = !hataAcik;
    ipucu.classList.toggle('gorunur', !hataAcik && Boolean(ipucu.textContent));
    durum.textContent = String(metin);
  };
</script>
</body>
</html>
